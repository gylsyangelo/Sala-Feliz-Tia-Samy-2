backend:
  name: github
  repo: gylsyangelo/Sala-Feliz-Tia-Samy-2
  branch: main # Mude para 'master' se sua branch no GitHub for master

media_folder: "assets/images"
public_folder: "assets/images"

collections:
  - name: "conteudo"
    label: "Gerenciamento do Site"
    files:
      - file: "conteudo.json"
        label: "Lista de Alunos e Textos"
        name: "dados_site"
        fields:
          - { label: "Título do Diário", name: "titulo_principal", widget: "string" }
          - { label: "Subtítulo / Descrição", name: "subtitulo", widget: "string" }
          - { label: "WhatsApp de Contato", name: "whatsapp", widget: "string" }
          - label: "Alunos Cadastrados na Turma"
            name: "alunos"
            widget: "list"
            field: { label: "Nome do Aluno", name: "nome", widget: "string" }
